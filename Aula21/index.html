<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header id="Cabecalho">
        <h1>Visualizador de Loops em JavaScript (For e While)</h1>
        <p>Clique nos botões abaixo para ver os laços d erepetição gerando conteúdo dinamicamente na página</p>
    </header>

    <main id="Conteudo">
        <section id="For">
            <h2>1.Exemplo com FOR (Contagem Regressiva)</h2>
            <button onclick="rodarLoopfor()">Rodar Loop FOR</button>
            <ul id="listaFor"</ul>
        </section>
        <hr>
        <section id="For">
            <h2>2.Exemplo com WHILE (Colocando Roupa na Mala)</h2>
            <button onclick="rodarLoopwhile()">Rodar Loop WHILE</button>
            <ul id="listaWhile"</ul>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
