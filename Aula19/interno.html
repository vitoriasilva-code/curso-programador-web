<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema interno</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header id="Cabecalho">
        <h1>Meu Sistema</h1>
        <button onclick="sair()">Sair</button>
    </header>

    <main class="conteudo">
        <section id="Bem-vindo">
            <h2>Bem-vindo!</h2>
            <p>Você está na página interna do sistema.</p>
        </section>

        <section id="Card">
            <h3>Área do usuário</h3>
            <p>Aqui poderiam ficar as funcionalidades do sistema.</p>
        </section>

        <section id="Card">
            <h3>Área de Feed</h3>
            <p>Aqui poderiam ficar atualizações ou historico de atividade do sistema.</p>
        </section>
    </main>

     <script src="script.js"></script>

</html>
