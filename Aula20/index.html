<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador</title>
</head>

<body>

    <header id="Titulo">
        <h1>Verificador de Número</h1>
    </header>

    <main id="Conteudo">
        <form action="#" method="post" id="formNumero">
            <label for="numero"> Digite um número:</label>
            <input type="number" id="numero" name="numero" placeholder="-6, 0, 9" required>

            <button type="submit">Enviar</button>
        </form>
        <p id="resultadoVisivel"></p>

        <script src="script.js"></script>
    </main>


</body>

</html>
